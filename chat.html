<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Chaos Community</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { cursor: default; overflow: hidden; }
    #app { display: none; }

    .chat-wrap {
      position: relative; z-index: 1; max-width: 800px; margin: 0 auto;
      height: 100vh; padding: 80px 16px 16px; display: flex; flex-direction: column;
    }
    .chat-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 18px; border-radius: 14px 14px 0 0;
      background: rgba(12,12,22,.85); border: 1px solid rgba(0,229,255,.4); border-bottom: none;
    }
    .chat-top h2 { color: #00e5ff; font-size: 1.1rem; }
    .live { font-size: .8rem; color: #4ade80; display: flex; align-items: center; gap: 6px; }
    .live::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
      box-shadow: 0 0 10px #4ade80; animation: blink 1.5s infinite;
    }

    #msgs {
      flex: 1; overflow-y: auto; padding: 18px;
      background: rgba(8,8,16,.8); border: 1px solid rgba(0,229,255,.4);
      backdrop-filter: blur(6px); scroll-behavior: smooth;
    }
    #msgs::-webkit-scrollbar { width: 8px; }
    #msgs::-webkit-scrollbar-thumb { background: #7b2ff7; border-radius: 8px; }

    .msg { display: flex; flex-direction: column; max-width: 78%; margin-bottom: 14px; animation: pop .3s; }
    .msg.me { margin-left: auto; align-items: flex-end; }
    @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.95); } to { opacity: 1; transform: none; } }

    .who { font-size: .75rem; margin: 0 6px 3px; font-weight: bold; }
    .bubble {
      padding: 10px 15px; border-radius: 16px; line-height: 1.45;
      word-break: break-word; white-space: pre-wrap;
      background: #1a1a2b; border: 1px solid #2b2b3d; color: #e8e8f5;
      border-bottom-left-radius: 4px;
    }
    .msg.me .bubble {
      background: linear-gradient(135deg, #ff2e63, #7b2ff7); border: none; color: #fff;
      border-radius: 16px; border-bottom-right-radius: 4px;
      box-shadow: 0 4px 18px rgba(255,46,99,.3);
    }
    .time { font-size: .68rem; color: #666680; margin: 3px 6px 0; }

    .sendbar {
      display: flex; gap: 10px; padding: 12px; border-radius: 0 0 14px 14px;
      background: rgba(12,12,22,.9); border: 1px solid rgba(0,229,255,.4); border-top: none;
    }
    .sendbar input {
      flex: 1; padding: 13px 18px; border-radius: 50px; border: 1.5px solid #2b2b3d;
      background: #0d0d18; color: #fff; font-size: 1rem; transition: all .25s;
    }
    .sendbar input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 18px rgba(0,229,255,.35); }
    .sendbar button {
      padding: 0 26px; border: none; border-radius: 50px; cursor: pointer;
      background: linear-gradient(135deg, #00e5ff, #7b2ff7); color: #fff; font-weight: 800;
      transition: transform .2s, box-shadow .2s;
    }
    .sendbar button:hover { transform: scale(1.07); box-shadow: 0 0 22px rgba(0,229,255,.6); }
    .sendbar button:disabled { opacity: .5; }

    .status { text-align: center; color: #8b8ba7; padding: 20px; }
    .status.err { color: #ff2e63; }
    #err { color: #ff2e63; font-size: .85rem; text-align: center; min-height: 1.2em; padding-top: 6px; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <nav class="nav">
    <a href="index.html" class="logo">CHAOS 🔥</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="members.html">Members</a>
    </div>
  </nav>

  <div id="loading" class="status" style="padding-top:160px">Check ho raha hai... 🔐</div>

  <main class="chat-wrap" id="app">
    <div class="chat-top">
      <h2>💬 Chaos Chat Room</h2>
      <span class="live">LIVE</span>
    </div>
    <div id="msgs"><p class="status" id="status">Messages load ho rahe hain...</p></div>
    <form class="sendbar" id="form">
      <input id="text" type="text" maxlength="500" placeholder="Kuch likh aur Enter dabaa..." autocomplete="off">
      <button type="submit" id="send">Bhej 🚀</button>
    </form>
    <p id="err"></p>
  </main>

  <script type="module" src="auth.js"></script>
  <script type="module">
    import { auth, db } from "./auth.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      collection, addDoc, onSnapshot, query, orderBy, limitToLast,
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // Background dots
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resize(); addEventListener("resize", resize);
    const dots = Array.from({ length: 45 }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      r: Math.random() * 2 + 1, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4,
    }));
    (function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      dots.forEach((d) => {
        d.x += d.vx; d.y += d.vy;
        if (d.x < 0 || d.x > canvas.width) d.vx *= -1;
        if (d.y < 0 || d.y > canvas.height) d.vy *= -1;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(123,47,247,.8)"; ctx.fill();
      });
      requestAnimationFrame(draw);
    })();

    const colors = ["#ff2e63", "#00e5ff", "#ffd166", "#4ade80", "#f72585", "#ff8a00", "#a78bfa"];
    function colorFor(uid) {
      let h = 0;
      for (const ch of uid) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return colors[h % colors.length];
    }

    // Login guard
    let me = null, started = false;
    onAuthStateChanged(auth, (user) => {
      if (!user) { location.replace("login.html"); return; }
      me = user;
      document.getElementById("loading").style.display = "none";
      document.getElementById("app").style.display = "flex";
      if (!started) { started = true; startChat(); }
    });

    function startChat() {
      const box = document.getElementById("msgs");
      const status = document.getElementById("status");
      const form = document.getElementById("form");
      const input = document.getElementById("text");
      const sendBtn = document.getElementById("send");
      const errEl = document.getElementById("err");
      let first = true;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        sendBtn.disabled = true;
        errEl.textContent = "";
        try {
          await addDoc(collection(db, "messages"), {
            text: text,
            uid: me.uid,
            name: me.displayName || me.email.split("@")[0],
            createdAt: Date.now(),
          });
          input.value = "";
        } catch (err) {
          errEl.textContent = "Message nahi gaya (" + err.code + "). Firestore rules check kar.";
        }
        sendBtn.disabled = false;
        input.focus();
      });

      function bubble(m) {
        const wrap = document.createElement("div");
        wrap.className = "msg" + (m.uid === me.uid ? " me" : "");
        if (m.uid !== me.uid) {
          const who = document.createElement("span");
          who.className = "who";
          who.style.color = colorFor(m.uid);
          who.textContent = m.name;
          wrap.append(who);
        }
        const b = document.createElement("div");
        b.className = "bubble";
        b.textContent = m.text;                 // textContent: koi HTML inject nahi kar sakta
        const t = document.createElement("span");
        t.className = "time";
        t.textContent = new Date(m.createdAt).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
        wrap.append(b, t);
        return wrap;
      }

      onSnapshot(
        query(collection(db, "messages"), orderBy("createdAt"), limitToLast(100)),
        (snap) => {
          const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
          box.innerHTML = "";
          if (snap.empty) {
            const p = document.createElement("p");
            p.className = "status";
            p.textContent = "Abhi koi message nahi. Pehla message tu bhej! 👋";
            box.append(p);
            return;
          }
          snap.docs.forEach((d) => box.append(bubble(d.data())));
          if (first || nearBottom) { box.scrollTop = box.scrollHeight; first = false; }
        },
        (err) => {
          status.className = "status err";
          status.textContent = "Chat load nahi hui (" + err.code + "). Firestore rules check kar.";
        }
      );
    }
  </script>
</body>
</html>
